<!DOCTYPE html>
<html>
<body>

<h2>Azure Queue WebJob Lab</h2>

<p>Queue Count: {{ count }}</p>

<form action="/add" method="post">
<input name="message" placeholder="hello / fail / slow">
<button type="submit">Add</button>
</form>

<form action="/bulk" method="post">
<input name="count" placeholder="10">
<button type="submit">Bulk Add</button>
</form>

<ul>
{% for m in messages %}
<li>{{ m.content }}</li>
{% endfor %}
</ul>

</body>
</html>
